<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴·재고</title>
<style>
  :root {
    --bg: #faf6f0;
    --panel: #ffffff;
    --side: #3b2a20;
    --side-text: #f3e9dc;
    --accent: #c8803a;
    --text: #2b2118;
    --muted: #8a7a6b;
    --line: #e8dfd3;
    --danger: #b3412f;
    --font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 18px;
  }
  h1 { margin: 0 0 20px; font-size: 26px; }
  h2 { margin: 0 0 14px; font-size: 20px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }

  form { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: var(--muted); }
  input {
    font: inherit;
    color: var(--text);
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    min-width: 0;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .f-name { flex: 2; min-width: 160px; }
  .f-num { flex: 1; min-width: 110px; }
  button {
    font: inherit;
    border: 0;
    border-radius: 12px;
    padding: 13px 22px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--danger); padding: 6px 10px; font-weight: 400; font-size: 15px; }
  button.step {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    width: 44px;
    height: 44px;
    padding: 0;
    font-size: 22px;
    line-height: 1;
  }

  .msg { margin-top: 12px; min-height: 1.4em; font-size: 15px; color: var(--muted); }
  .msg.err { color: var(--danger); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 400; font-size: 15px; }
  td input { width: 100%; padding: 10px 12px; }
  td.price input { width: 120px; }
  .stock { display: flex; align-items: center; gap: 6px; }
  .stock input { width: 80px; text-align: center; }
  .low { color: var(--danger); font-size: 14px; font-weight: 700; margin-left: 6px; white-space: nowrap; }
  .empty { color: var(--muted); padding: 16px 0; }
</style>
</head>
<body>
  <h1>메뉴·재고</h1>

  <section class="card">
    <h2>메뉴 추가</h2>
    <form id="form">
      <label class="f-name">메뉴 이름
        <input id="name" required maxlength="40" placeholder="예) 아메리카노" autocomplete="off">
      </label>
      <label class="f-num">가격(원)
        <input id="price" type="number" inputmode="numeric" min="0" step="10" required placeholder="4500">
      </label>
      <label class="f-num">재고(개)
        <input id="stock" type="number" inputmode="numeric" min="0" step="1" value="0" required>
      </label>
      <button id="add" type="submit">추가</button>
    </form>
    <div class="msg" id="msg"></div>
  </section>

  <section class="card">
    <h2>메뉴 목록</h2>
    <div id="list"></div>
  </section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // 공개 키(publishable)만 사용한다. 비밀 키는 이 파일에 넣지 않는다.
  const SUPABASE_URL = "https://vbnemtsxmtmzwrcwctpp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_gpef23Q8zD0zHQUMmzIE9Q_WVLr2Zss";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const LOW_STOCK = 5; // 이 수량 이하면 "부족"으로 표시 (홈 카드에서도 같은 기준을 쓴다)

  const $ = id => document.getElementById(id);
  const won = n => n.toLocaleString("ko-KR") + "원";

  function say(text, isErr) {
    $("msg").textContent = text;
    $("msg").className = "msg" + (isErr ? " err" : "");
  }

  function errText(error) {
    return error.code === "23505" ? "같은 이름의 메뉴가 이미 있어요." : error.message;
  }

  async function update(id, fields) {
    const { error } = await db.from("menus").update(fields).eq("id", id);
    if (error) { say("저장하지 못했어요: " + errText(error), true); }
    else { say("저장했어요."); }
    load();
  }

  async function remove(m) {
    if (!confirm("'" + m.name + "' 메뉴를 삭제할까요?")) return;
    const { error } = await db.from("menus").delete().eq("id", m.id);
    if (error) { say("삭제하지 못했어요: " + error.message, true); return; }
    say("삭제했어요.");
    load();
  }

  function row(m) {
    const tr = document.createElement("tr");

    const nameTd = document.createElement("td");
    const name = document.createElement("input");
    name.value = m.name;
    name.maxLength = 40;
    name.addEventListener("change", () => {
      const v = name.value.trim();
      if (!v) { name.value = m.name; return; }
      update(m.id, { name: v });
    });
    nameTd.appendChild(name);

    const priceTd = document.createElement("td");
    priceTd.className = "price";
    const price = document.createElement("input");
    price.type = "number";
    price.min = 0;
    price.step = 10;
    price.value = m.price;
    price.addEventListener("change", () => {
      const v = Number(price.value);
      if (!(v >= 0) || price.value === "") { price.value = m.price; return; }
      update(m.id, { price: Math.round(v) });
    });
    priceTd.appendChild(price);

    const stockTd = document.createElement("td");
    const wrap = document.createElement("div");
    wrap.className = "stock";
    const minus = document.createElement("button");
    minus.className = "step";
    minus.textContent = "−";
    minus.disabled = m.stock <= 0;
    minus.addEventListener("click", () => update(m.id, { stock: m.stock - 1 }));
    const stock = document.createElement("input");
    stock.type = "number";
    stock.min = 0;
    stock.step = 1;
    stock.value = m.stock;
    stock.addEventListener("change", () => {
      const v = Number(stock.value);
      if (!(v >= 0) || stock.value === "") { stock.value = m.stock; return; }
      update(m.id, { stock: Math.round(v) });
    });
    const plus = document.createElement("button");
    plus.className = "step";
    plus.textContent = "+";
    plus.addEventListener("click", () => update(m.id, { stock: m.stock + 1 }));
    wrap.append(minus, stock, plus);
    if (m.stock <= LOW_STOCK) {
      const low = document.createElement("span");
      low.className = "low";
      low.textContent = m.stock === 0 ? "품절" : "부족";
      wrap.appendChild(low);
    }
    stockTd.appendChild(wrap);

    const delTd = document.createElement("td");
    const del = document.createElement("button");
    del.className = "ghost";
    del.textContent = "삭제";
    del.addEventListener("click", () => remove(m));
    delTd.appendChild(del);

    tr.append(nameTd, priceTd, stockTd, delTd);
    return tr;
  }

  async function load() {
    const { data, error } = await db.from("menus").select("*").order("id");
    const box = $("list");
    box.textContent = "";
    if (error) { say("불러오지 못했어요: " + error.message, true); return; }

    if (data.length === 0) {
      const p = document.createElement("div");
      p.className = "empty";
      p.textContent = "아직 등록한 메뉴가 없어요. 위에서 추가해 주세요.";
      box.appendChild(p);
      return;
    }

    const table = document.createElement("table");
    table.innerHTML = "<thead><tr><th>메뉴</th><th>가격(원)</th><th>재고</th><th></th></tr></thead>";
    const body = document.createElement("tbody");
    data.forEach(m => body.appendChild(row(m)));
    table.appendChild(body);
    box.appendChild(table);
  }

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("name").value.trim();
    const price = Number($("price").value);
    const stock = Number($("stock").value);
    if (!name || !(price >= 0) || !(stock >= 0)) { say("메뉴 이름, 가격, 재고를 확인해 주세요.", true); return; }

    $("add").disabled = true;
    const { error } = await db.from("menus").insert({ name, price: Math.round(price), stock: Math.round(stock) });
    $("add").disabled = false;

    if (error) { say("추가하지 못했어요: " + errText(error), true); return; }
    say("'" + name + "' 메뉴를 추가했어요.");
    $("name").value = "";
    $("price").value = "";
    $("stock").value = "0";
    $("name").focus();
    load();
  });

  load();
</script>
</body>
</html>
