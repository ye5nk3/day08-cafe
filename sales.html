<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매출</title>
<style>
  :root {
    --bg: #faf6f0;
    --panel: #ffffff;
    --side: #3b2a20;
    --side-text: #f3e9dc;
    --accent: #c8803a;
    --text: #2b2118;
    --muted: #8a7a6b;
    --line: #e8dfd3;
    --danger: #b3412f;
    --font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 18px;
  }
  h1 { margin: 0 0 20px; font-size: 26px; }
  h2 { margin: 0 0 14px; font-size: 20px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .summary { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 160px; }
  .stat .label { color: var(--muted); font-size: 15px; }
  .stat .value { font-size: 30px; font-weight: 700; margin-top: 4px; }

  form { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: var(--muted); }
  input {
    font: inherit;
    color: var(--text);
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    min-width: 0;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .f-name { flex: 2; min-width: 160px; }
  .f-num { flex: 1; min-width: 110px; }
  .total { padding: 12px 0; font-weight: 700; white-space: nowrap; }
  button {
    font: inherit;
    border: 0;
    border-radius: 12px;
    padding: 13px 22px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--danger); padding: 6px 10px; font-weight: 400; font-size: 15px; }

  .msg { margin-top: 12px; min-height: 1.4em; font-size: 15px; color: var(--muted); }
  .msg.err { color: var(--danger); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 400; font-size: 15px; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .empty { color: var(--muted); padding: 16px 0; }
</style>
</head>
<body>
  <h1>매출</h1>

  <section class="card summary">
    <div class="stat"><div class="label">오늘 매출</div><div class="value" id="today-amount">-</div></div>
    <div class="stat"><div class="label">오늘 판매 건수</div><div class="value" id="today-count">-</div></div>
  </section>

  <section class="card">
    <h2>판매 입력</h2>
    <form id="form">
      <label class="f-name">메뉴 이름
        <input id="name" required maxlength="40" placeholder="예) 아메리카노" autocomplete="off">
      </label>
      <label class="f-num">단가(원)
        <input id="price" type="number" inputmode="numeric" min="0" step="100" required placeholder="4500">
      </label>
      <label class="f-num">수량
        <input id="qty" type="number" inputmode="numeric" min="1" step="1" value="1" required>
      </label>
      <div class="total">합계 <span id="sum">0</span>원</div>
      <button id="save" type="submit">판매 저장</button>
    </form>
    <div class="msg" id="msg"></div>
  </section>

  <section class="card">
    <h2>최근 판매 내역</h2>
    <div id="list"></div>
  </section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // 공개 키(publishable)만 사용한다. 비밀 키는 이 파일에 넣지 않는다.
  const SUPABASE_URL = "https://vbnemtsxmtmzwrcwctpp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_gpef23Q8zD0zHQUMmzIE9Q_WVLr2Zss";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);
  const won = n => n.toLocaleString("ko-KR") + "원";

  function say(text, isErr) {
    $("msg").textContent = text;
    $("msg").className = "msg" + (isErr ? " err" : "");
  }

  function updateSum() {
    const p = Number($("price").value) || 0;
    const q = Number($("qty").value) || 0;
    $("sum").textContent = (p * q).toLocaleString("ko-KR");
  }
  $("price").addEventListener("input", updateSum);
  $("qty").addEventListener("input", updateSum);

  function fmtTime(iso) {
    const d = new Date(iso);
    const two = n => String(n).padStart(2, "0");
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + two(d.getHours()) + ":" + two(d.getMinutes());
  }

  async function load() {
    // 오늘 합계 (기기 시간 기준 0시~24시)
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const end = new Date(start); end.setDate(end.getDate() + 1);

    const [today, recent] = await Promise.all([
      db.from("sales").select("amount").gte("sold_at", start.toISOString()).lt("sold_at", end.toISOString()),
      db.from("sales").select("*").order("sold_at", { ascending: false }).limit(30),
    ]);

    if (today.error || recent.error) {
      say("불러오지 못했어요: " + (today.error || recent.error).message, true);
      return;
    }

    $("today-amount").textContent = won(today.data.reduce((s, r) => s + r.amount, 0));
    $("today-count").textContent = today.data.length + "건";

    const box = $("list");
    box.textContent = "";
    if (recent.data.length === 0) {
      const p = document.createElement("div");
      p.className = "empty";
      p.textContent = "아직 입력한 판매가 없어요.";
      box.appendChild(p);
      return;
    }

    const table = document.createElement("table");
    table.innerHTML = "<thead><tr><th>시간</th><th>메뉴</th><th class='num'>수량</th><th class='num'>금액</th><th></th></tr></thead>";
    const body = document.createElement("tbody");
    for (const r of recent.data) {
      const tr = document.createElement("tr");
      const cells = [fmtTime(r.sold_at), r.menu_name, String(r.quantity), won(r.amount)];
      cells.forEach((t, i) => {
        const td = document.createElement("td");
        td.textContent = t;
        if (i >= 2) td.className = "num";
        tr.appendChild(td);
      });
      const td = document.createElement("td");
      td.className = "num";
      const del = document.createElement("button");
      del.className = "ghost";
      del.textContent = "삭제";
      del.addEventListener("click", () => remove(r));
      td.appendChild(del);
      tr.appendChild(td);
      body.appendChild(tr);
    }
    table.appendChild(body);
    box.appendChild(table);
  }

  async function remove(r) {
    if (!confirm(r.menu_name + " " + r.quantity + "개 판매를 삭제할까요?")) return;
    const { error } = await db.from("sales").delete().eq("id", r.id);
    if (error) { say("삭제하지 못했어요: " + error.message, true); return; }
    say("삭제했어요.");
    load();
  }

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("name").value.trim();
    const price = Number($("price").value);
    const qty = Number($("qty").value);
    if (!name || !(qty >= 1) || !(price >= 0)) { say("메뉴, 단가, 수량을 확인해 주세요.", true); return; }

    $("save").disabled = true;
    const { error } = await db.from("sales").insert({
      menu_name: name,
      quantity: qty,
      amount: price * qty,
    });
    $("save").disabled = false;

    if (error) { say("저장하지 못했어요: " + error.message, true); return; }
    say(name + " " + qty + "개, " + won(price * qty) + " 저장했어요.");
    $("name").value = "";
    $("price").value = "";
    $("qty").value = "1";
    updateSum();
    $("name").focus();
    load();
  });

  load();
</script>
</body>
</html>
