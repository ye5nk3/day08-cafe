<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 홍보 문구</title>
<style>
  :root {
    --bg: #faf6f0;
    --panel: #ffffff;
    --side: #3b2a20;
    --side-text: #f3e9dc;
    --accent: #c8803a;
    --text: #2b2118;
    --muted: #8a7a6b;
    --line: #e8dfd3;
    --danger: #b3412f;
    --ok: #3f7d4e;
    --font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 18px;
  }
  h1 { margin: 0 0 6px; font-size: 26px; }
  h2 { margin: 0 0 14px; font-size: 20px; }
  .sub { color: var(--muted); font-size: 15px; margin-bottom: 20px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }

  form { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: var(--muted); }
  input, select, textarea {
    font: inherit;
    color: var(--text);
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    min-width: 0;
  }
  textarea { width: 100%; resize: vertical; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .f-wide { flex: 1 0 100%; }
  .f-half { flex: 1; min-width: 160px; }
  .menu-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 15px; color: var(--muted); }
  .chip {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 15px;
    font-weight: 400;
  }
  button {
    font: inherit;
    border: 0;
    border-radius: 12px;
    padding: 13px 22px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.light { background: var(--bg); color: var(--text); border: 1px solid var(--line); font-weight: 400; padding: 10px 16px; }

  .msg { margin-top: 12px; min-height: 1.4em; font-size: 15px; color: var(--muted); }
  .msg.err { color: var(--danger); }

  .notice { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
  .option-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .option-head .tag { font-weight: 700; }
  .status { font-size: 14px; color: var(--muted); margin-left: 8px; }
  .count { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <h1>AI 홍보 문구</h1>
  <div class="sub">홍보하고 싶은 내용을 적으면 문구 후보 3개를 만들어 줘요. 마음에 드는 걸 고쳐서 쓰세요.</div>

  <section class="card">
    <form id="form">
      <label class="f-wide">홍보할 내용
        <textarea id="menu" required maxlength="200" rows="3" placeholder="예) 신메뉴 흑임자 라떼 출시, 오늘부터 판매"></textarea>
      </label>
      <div class="f-wide menu-row" id="menu-row" hidden>
        <span>메뉴에서 불러오기</span>
        <span id="chips"></span>
      </div>
      <label class="f-half">올릴 곳
        <select id="channel">
          <option>인스타그램</option>
          <option>동네 커뮤니티(당근 등)</option>
          <option>카카오톡·문자</option>
          <option>매장 입구 안내판</option>
        </select>
      </label>
      <label class="f-half">분위기
        <select id="mood">
          <option>포근하고 따뜻한</option>
          <option>발랄하고 경쾌한</option>
          <option>담백하고 차분한</option>
          <option>고급스럽고 세련된</option>
        </select>
      </label>
      <button id="make" type="submit">문구 만들기</button>
    </form>
    <div class="msg" id="msg"></div>
  </section>

  <div id="results"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // 공개 키만 사용한다. 비밀 키(AI 키)는 Edge Function의 Secrets에만 있다.
  const SUPABASE_URL = "https://vbnemtsxmtmzwrcwctpp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_gpef23Q8zD0zHQUMmzIE9Q_WVLr2Zss";
  // Edge Function은 JWT 검증을 켜 두어서 anon(JWT) 키로 호출한다.
  const FUNCTION_URL = SUPABASE_URL + "/functions/v1/cafe-ai";
  const ANON_JWT = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZibmVtdHN4bXRtendyY3djdHBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3OTU1MjEsImV4cCI6MjEwNzM3MTUyMX0.4MjCj4HGv9fnGgQ1dax7xqm_7h6VeEFs9fCtDCbG5Jw";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);

  function say(text, isErr) {
    $("msg").textContent = text;
    $("msg").className = "msg" + (isErr ? " err" : "");
  }

  // index.html 사이드바에서 고른 모델. "auto"거나 읽을 수 없으면 지정하지 않는다.
  function pickedModel() {
    try {
      const v = localStorage.getItem("cafe-ai-model");
      return v && v !== "auto" ? v : undefined;
    } catch (e) { return undefined; }
  }

  // 등록한 메뉴를 눌러 "홍보할 내용"에 넣을 수 있게 한다. 못 불러와도 직접 입력은 가능.
  async function loadMenus() {
    const { data, error } = await db.from("menus").select("name, price").order("id");
    if (error || !data || data.length === 0) return;
    data.slice(0, 12).forEach(m => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = m.name;
      b.addEventListener("click", () => {
        const text = m.name + " (" + m.price.toLocaleString("ko-KR") + "원)";
        const cur = $("menu").value.trim();
        $("menu").value = cur ? cur + ", " + text : text;
        $("menu").focus();
      });
      $("chips").appendChild(b);
    });
    $("menu-row").hidden = false;
  }

  async function generate(payload) {
    const res = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + ANON_JWT,
        "apikey": ANON_JWT,
      },
      body: JSON.stringify({ type: "promo", model: pickedModel(), ...payload }),
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(data.error || "AI 요청에 실패했어요. (" + res.status + ")");
    return data; // { text, options, model }
  }

  function renderResults(out) {
    const box = $("results");
    box.textContent = "";

    const short = (out.model || "").split("/").pop().replace(":free", "");
    const card = document.createElement("section");
    card.className = "card";
    const h = document.createElement("h2");
    h.textContent = "문구 후보";
    const notice = document.createElement("div");
    notice.className = "notice";
    notice.textContent = "AI가 입력에 없던 내용을 넣을 수 있어요. 올리기 전에 가격·이벤트 같은 사실을 꼭 확인하고 고쳐 주세요."
      + (short ? " (" + short + "로 작성)" : "");
    card.append(h, notice);

    out.options.forEach((text, i) => {
      const wrap = document.createElement("div");
      wrap.style.marginBottom = i === out.options.length - 1 ? "0" : "18px";

      const head = document.createElement("div");
      head.className = "option-head";
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = "후보 " + (i + 1);
      const right = document.createElement("span");
      const count = document.createElement("span");
      count.className = "count";
      const status = document.createElement("span");
      status.className = "status";
      const copy = document.createElement("button");
      copy.className = "light";
      copy.textContent = "복사";
      right.append(count, status, " ", copy);
      head.append(tag, right);

      const ta = document.createElement("textarea");
      ta.value = text;
      ta.rows = Math.min(8, Math.max(3, text.split("\n").length + 1));
      const upd = () => { count.textContent = ta.value.length + "자"; };
      ta.addEventListener("input", upd);
      upd();

      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(ta.value);
          status.textContent = "복사했어요";
        } catch (e) {
          ta.select();
          status.textContent = "선택했어요. Ctrl/⌘+C로 복사해 주세요";
        }
        setTimeout(() => { status.textContent = ""; }, 3000);
      });

      wrap.append(head, ta);
      card.appendChild(wrap);
    });

    box.appendChild(card);
  }

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const menu = $("menu").value.trim();
    if (!menu) { say("홍보할 내용을 적어 주세요.", true); return; }

    $("make").disabled = true;
    $("make").textContent = "만드는 중…";
    say("문구를 만드는 중이에요. 10~20초 정도 걸려요.");
    try {
      const out = await generate({ menu, channel: $("channel").value, mood: $("mood").value });
      renderResults(out);
      say("후보 " + out.options.length + "개를 만들었어요. 마음에 드는 걸 고쳐서 복사해 주세요.");
    } catch (err) {
      say(err.message, true);
    }
    $("make").disabled = false;
    $("make").textContent = $("results").children.length ? "다시 만들기" : "문구 만들기";
  });

  loadMenus();
</script>
</body>
</html>
